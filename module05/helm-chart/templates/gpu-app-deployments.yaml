    spec:
      imagePullSecrets:
        - name: acr-secret
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
      containers:
        - name: gpu-app2
          image: {{ .Values.acr }}/{{ .Values.myGPUApp.image }}:{{ .Values.myGPUApp.tag }}
          ports:
            - containerPort: {{ .Values.myGPUApp.port }}
          resources: # Time-slicing enabled: can share GPU with other pods
            limits:
              nvidia.com/gpu: 1  # Requests one virtual GPU (1/4 of physical GPU)

