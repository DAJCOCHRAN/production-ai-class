apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-app1
spec:
  replicas: {{ .Values.myGPUApp.replicas }}
  selector:
    matchLabels:
      app: gpu-app1
  template:
    metadata:
      labels:
        app: gpu-app1
    spec:
      imagePullSecrets:
        - name: acr-secret
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
      containers:
        - name: gpu-app1
          image: {{ .Values.acr }}/{{ .Values.myGPUApp.image }}:{{ .Values.myGPUApp.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.myGPUApp.port }}
          resources: # Time-slicing enabled: each physical GPU is split into 4 virtual GPUs
            limits:
              nvidia.com/gpu: 1  # Requests one virtual GPU (1/4 of physical GPU)

---
# GPU ENABLED POD (Time-slicing allows sharing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-app2
spec:
  replicas: {{ .Values.myGPUApp.replicas }}
  selector:
