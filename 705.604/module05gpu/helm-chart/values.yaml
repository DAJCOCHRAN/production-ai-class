acr: ACR_DOMAIN_NAME # Your ACR Domain name here

# one pod with one container
gateway:
  image: gateway-service
  tag: GATEWAY_SERVICE_TAG
  port: 5000

# we will make 1 pod with 3 copies of the gpuApp as containers

myGPUApp: # container
  image: gpu-app
  tag: GPU_APP_TAG
  replicas: 1
  port: 8000
  