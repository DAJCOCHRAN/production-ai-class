apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-app
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker-app
  template:
    metadata:
      labels:
        app: worker-app
    spec:
      # Prefer a different node for each replica, so the fan-out crosses nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: worker-app
      containers:
        - name: worker-app
          image: {{ .Values.acr }}/{{ .Values.worker.image }}:{{ .Values.worker.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.worker.port }}
          env:
            - name: PORT
              value: "{{ .Values.worker.port }}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /status
              port: {{ .Values.worker.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
